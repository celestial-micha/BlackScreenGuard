name: Publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.0.4
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish v1.0.4 release'
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'v1.0.4' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build EXE
        shell: cmd
        run: build-exe.cmd

      - name: Verify package and create checksum
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath 'dist\BlackScreenGuard.exe'
          if ($exe.VersionInfo.FileVersion -ne '1.0.4.0') {
            throw "Unexpected EXE version: $($exe.VersionInfo.FileVersion)"
          }
          if ($exe.VersionInfo.CompanyName -ne 'celestial-micha') {
            throw "Unexpected EXE publisher metadata: $($exe.VersionInfo.CompanyName)"
          }
          $legacyFiles = @(
            'BlackScreenGuard.ps1',
            'package.sed',
            'run-packaged.cmd',
            'set-icon.js'
          )
          foreach ($legacyFile in $legacyFiles) {
            if (Test-Path -LiteralPath $legacyFile) {
              throw "Unsafe legacy packaging file is still present: $legacyFile"
            }
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName).Hash.ToLowerInvariant()
          "$hash  BlackScreenGuard.exe" |
            Set-Content -LiteralPath 'dist\SHA256SUMS.txt' -Encoding ascii -NoNewline

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_VERSION `
            --target $env:GITHUB_SHA `
            --title "BlackScreen Guard $env:RELEASE_VERSION" `
            --notes "将程序迁移为原生 C# WinForms EXE，移除 IExpress、自解压脚本、隐藏 PowerShell 和 ExecutionPolicy Bypass，同时保留 v1.0.3 的关屏行为。`n`nMigrate the application to a native C# WinForms executable, removing IExpress, self-extracting scripts, hidden PowerShell, and ExecutionPolicy Bypass while preserving the v1.0.3 display-off behavior." `
            --latest `
            'dist\BlackScreenGuard.exe' `
            'dist\SHA256SUMS.txt'
