name: Publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.0.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish v1.0.2 release'
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'v1.0.2' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install build dependency
        run: pnpm install --frozen-lockfile

      - name: Build EXE
        shell: cmd
        run: build-exe.cmd

      - name: Verify package and create checksum
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath 'dist\BlackScreenGuard.exe'
          if ($exe.VersionInfo.FileVersion -ne '1.0.2.0') {
            throw "Unexpected EXE version: $($exe.VersionInfo.FileVersion)"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName).Hash.ToLowerInvariant()
          "$hash  BlackScreenGuard.exe" |
            Set-Content -LiteralPath 'dist\SHA256SUMS.txt' -Encoding ascii -NoNewline

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_VERSION `
            --target $env:GITHUB_SHA `
            --title "BlackScreen Guard $env:RELEASE_VERSION" `
            --notes "修复绿区或安全软件导致黑屏窗口短暂失焦时，因未声明事件参数而出现的 `$sender 未设置异常。`n`nFix the unhandled `$sender variable error when the blackout window temporarily loses focus." `
            --latest `
            'dist\BlackScreenGuard.exe' `
            'dist\SHA256SUMS.txt'
